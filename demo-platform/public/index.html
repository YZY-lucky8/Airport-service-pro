<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>恒盾智航 · 答辩自动化演示平台</title>
<style>
/* ============================================================
   恒盾智航 · 答辩自动化演示平台（深色科技 SOC 风格）
   样式体系对齐 frontend/demo/assets/css/style.css；
   布局参考 frontend/security/assets/security.html 的
   defense-tech-grid 卡片网格与 stats-row KPI 行。
   仅改 UI 样式与布局，功能逻辑不变，server.js 无需改动。
   ============================================================ */
:root {
    --bg-1: #0a1628;
    --bg-2: #132044;
    --cyan: #00d4ff;
    --blue: #4fc3f7;
    --green: #00e676;
    --orange: #ffa726;
    --red: #ff5252;
    --text: #dce9ff;
    --text-secondary: #7d92b8;
    --card-bg: rgba(13, 28, 54, 0.55);
    --card-border: rgba(0, 212, 255, 0.22);
    --mono: 'Consolas', 'JetBrains Mono', 'Courier New', monospace;
    --topbar-h: 58px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: var(--text);
    font-size: 14px;
    background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0, 212, 255, 0.12), transparent 60%),
        radial-gradient(ellipse 60% 40% at 90% 110%, rgba(79, 195, 247, 0.08), transparent 60%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
    background-attachment: fixed;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
/* 细网格科技底纹 */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(0, 212, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
}
/* 扫描线动画 */
body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, transparent 0%, rgba(0, 212, 255, 0.03) 50%, transparent 100%);
    background-size: 100% 6px;
    pointer-events: none;
    z-index: 0;
    animation: scan 8s linear infinite;
}
@keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
@keyframes blink { 50% { opacity: .35; } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

/* ============ 顶栏（sticky 毛玻璃 + 品牌渐变 + 状态点 + 时钟） ============ */
header {
    height: var(--topbar-h);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    flex-shrink: 0;
    background: rgba(10, 22, 40, 0.75);
    border-bottom: 1px solid rgba(0, 212, 255, 0.18);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 2px 20px rgba(0, 212, 255, 0.06);
}
header h1 {
    font-size: 17px;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #ffffff, var(--cyan));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}
header .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--text-secondary);
    box-shadow: 0 0 6px rgba(125, 146, 184, 0.5);
    transition: background .2s, box-shadow .2s;
}
header .dot.running { background: var(--orange); box-shadow: 0 0 10px var(--orange); animation: blink 1s infinite; }
header .dot.up { background: var(--green); box-shadow: 0 0 10px var(--green), 0 0 20px rgba(0, 230, 118, 0.5); animation: pulse 2s ease-in-out infinite; }
.status-text { font-size: 12px; color: var(--text-secondary); font-family: var(--mono); }
header .spacer { flex: 1; }
#topbar-clock { font-family: var(--mono); color: var(--cyan); font-size: 14px; margin-right: 4px; text-shadow: 0 0 8px rgba(0, 212, 255, 0.4); }

/* ============ 按钮：青色渐变 + ghost ============ */
header button, .run-btn {
    height: 34px;
    padding: 0 16px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    color: #04121f;
    background: linear-gradient(90deg, rgba(0, 212, 255, 0.85), rgba(79, 195, 247, 0.85));
    font-weight: 600;
    letter-spacing: 1px;
    transition: all .2s;
}
header button:hover, .run-btn:hover { box-shadow: 0 0 16px rgba(0, 212, 255, 0.5); transform: translateY(-1px); }
header button:disabled, .run-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
#btn-stop { background: transparent; color: var(--red); border: 1px solid rgba(255, 82, 82, 0.5); }
#btn-stop:hover { box-shadow: 0 0 14px rgba(255, 82, 82, 0.4); border-color: var(--red); }
#btn-clear { background: transparent; color: var(--text); border: 1px solid rgba(0, 212, 255, 0.4); }
#btn-clear:hover { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px rgba(0, 212, 255, 0.3); }

/* ============ 主区 ============ */
main { flex: 1; display: flex; min-height: 0; position: relative; z-index: 1; }

/* ============ 左侧终端（深蓝科技主题） ============ */
#terminal-wrap {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    background: rgba(6, 13, 28, 0.85);
    border-right: 1px solid rgba(0, 212, 255, 0.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}
#term-title {
    padding: 8px 16px; font-size: 12px; color: var(--text-secondary);
    background: rgba(10, 22, 40, 0.6);
    border-bottom: 1px solid rgba(0, 212, 255, 0.12);
    flex-shrink: 0;
    display: flex; gap: 14px; align-items: center;
    letter-spacing: 1px;
}
#term-title b { color: var(--cyan); font-weight: 600; text-shadow: 0 0 8px rgba(0, 212, 255, 0.4); }
#terminal {
    flex: 1; overflow-y: auto; padding: 14px 16px;
    font-family: var(--mono);
    font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-all;
}
#terminal .cmd-line { color: var(--cyan); text-shadow: 0 0 8px rgba(0, 212, 255, 0.35); }
#terminal .cmd-note { color: var(--text-secondary); }
#terminal .out { color: #aef0ff; }
#terminal .err { color: var(--red); }
#terminal .exit { color: #5b7290; }
#terminal .sep { color: var(--orange); font-weight: 700; text-shadow: 0 0 8px rgba(255, 167, 38, 0.4); }
#terminal .json { color: var(--blue); }

/* ============ 右侧面板（KPI + 两列 defense-tech 卡片网格） ============ */
#panel {
    width: 620px; min-width: 520px; overflow-y: auto; padding: 16px;
    position: relative;
}
/* KPI 统计行 */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.stat-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    padding: 12px 14px;
    transition: box-shadow .25s, border-color .25s;
}
.stat-card:hover { border-color: rgba(0, 212, 255, 0.4); box-shadow: 0 0 24px rgba(0, 212, 255, 0.12); }
.stat-label { font-size: 11px; color: var(--text-secondary); letter-spacing: 1px; margin-bottom: 6px; }
.stat-value { font-family: var(--mono); font-size: 20px; font-weight: 700; }
.stat-value.cyan   { color: var(--cyan);   text-shadow: 0 0 12px rgba(0, 212, 255, 0.5); }
.stat-value.green  { color: var(--green);  text-shadow: 0 0 12px rgba(0, 230, 118, 0.5); }
.stat-value.orange { color: var(--orange); text-shadow: 0 0 12px rgba(255, 167, 38, 0.5); }
.stat-value.blue   { color: var(--blue);   text-shadow: 0 0 12px rgba(79, 195, 247, 0.5); }
.stat-desc { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }

/* 分组标题 */
.group-title {
    display: flex; align-items: baseline; gap: 10px;
    margin: 18px 2px 10px;
    font-size: 14px; font-weight: 700; color: var(--blue); letter-spacing: 2px;
}
.group-title::before {
    content: '';
    width: 4px; height: 14px;
    background: linear-gradient(180deg, var(--cyan), transparent);
    border-radius: 2px;
    align-self: center;
}
.group-title small { font-size: 11px; font-weight: 400; color: var(--text-secondary); letter-spacing: 0; }
.group-title:first-of-type { margin-top: 0; }

/* 两列 defense-tech 网格 */
.defense-tech-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* ============ 通用卡片（毛玻璃 + 发光边框，保留 .card class） ============ */
#panel .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 0 22px rgba(0, 212, 255, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    padding: 14px;
    transition: box-shadow .25s, border-color .25s, transform .2s;
}
#panel .card:hover { border-color: rgba(0, 212, 255, 0.4); box-shadow: 0 0 26px rgba(0, 212, 255, 0.14); transform: translateY(-1px); }
#panel .card .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
#panel .card h3 { font-size: 13.5px; font-weight: 700; color: var(--blue); letter-spacing: 1px; flex: 1; }
#panel .card .brief { font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; line-height: 1.6; }
.cmd-item {
    border-left: 3px solid rgba(0, 212, 255, 0.45);
    padding: 8px 0 8px 10px; margin-bottom: 10px;
    background: rgba(10, 22, 40, 0.5); border-radius: 6px;
}
.cmd-item .c-cmd { font-family: var(--mono); font-size: 12px; color: var(--cyan); word-break: break-all; text-shadow: 0 0 6px rgba(0, 212, 255, 0.2); }
.cmd-item .c-purpose { font-size: 12px; color: var(--text); margin-top: 4px; }
.cmd-item .c-ref { font-size: 11px; color: var(--text-secondary); margin-top: 4px; line-height: 1.6; }
.cmd-item .c-ref b { color: var(--orange); font-weight: 600; }
.run-btn { width: 100%; margin-top: 4px; }

/* ============ 三态徽章（发光） ============ */
.badge {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
}
.badge-normal   { color: var(--green);  border: 1px solid rgba(0, 230, 118, 0.6);  background: rgba(0, 230, 118, 0.10); text-shadow: 0 0 8px rgba(0, 230, 118, 0.5); }
.badge-degraded { color: var(--orange); border: 1px solid rgba(255, 167, 38, 0.6); background: rgba(255, 167, 38, 0.10); text-shadow: 0 0 8px rgba(255, 167, 38, 0.5); }
.badge-locked   { color: var(--red);    border: 1px solid rgba(255, 82, 82, 0.6);   background: rgba(255, 82, 82, 0.10); text-shadow: 0 0 8px rgba(255, 82, 82, 0.5); }
.tech-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
}

/* ============ c8 现场输入框 ============ */
#input-box {
    width: 100%; margin: 8px 0; padding: 8px 10px; border-radius: 8px;
    background: rgba(10, 22, 40, 0.6);
    border: 1px solid rgba(0, 212, 255, 0.25);
    color: var(--text);
    font-family: var(--mono); font-size: 12.5px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
}
#input-box:focus { border-color: var(--cyan); box-shadow: 0 0 12px rgba(0, 212, 255, 0.25); }
#input-box::placeholder { color: #55709c; }

/* ============ 自定义滚动条 ============ */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.04); }
::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.35); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0, 212, 255, 0.55); }
</style>
</head>
<body>
<header>
  <span class="dot" id="status-dot" title="平台状态"></span>
  <h1>恒盾智航 · 答辩自动化演示平台</h1>
  <span id="status-text" class="status-text">就绪</span>
  <span class="spacer"></span>
  <span id="topbar-clock"></span>
  <button id="btn-service" title="后台启动后端服务(node app.js)，自动探测 3000 端口">启动后端服务</button>
  <button id="btn-stop" title="停止当前正在执行的演示">停止</button>
  <button id="btn-clear" title="清空左侧终端">清屏</button>
  <button id="btn-all" title="依次运行创新点①~⑦ 全部演示">全部演示</button>
</header>

<main>
  <section id="terminal-wrap">
    <div id="term-title"><b>终端同步区</b><span>点击右侧命令按钮 → 命令在此实时执行，前一条退出后自动执行下一条</span></div>
    <div id="terminal"></div>
  </section>
  <aside id="panel">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">覆盖创新点</div>
        <div class="stat-value blue" id="kpi-innov">7 项</div>
        <div class="stat-desc">创新点①~⑦ 全覆盖</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">演示命令</div>
        <div class="stat-value cyan" id="kpi-cmds">-- 条</div>
        <div class="stat-desc">shell / service / fetch</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">后端服务</div>
        <div class="stat-value orange" id="kpi-service">未启动</div>
        <div class="stat-desc">127.0.0.1:3000 探测</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">平台运行</div>
        <div class="stat-value green" id="kpi-platform">就绪</div>
        <div class="stat-desc">演示执行状态</div>
      </div>
    </div>
    <div class="group-title"><span>核心创新点演示</span><small>创新点①~⑥ · 防御机制闭环</small></div>
    <div id="group-core" class="defense-tech-grid"></div>
    <div class="group-title"><span>实时接口互动</span><small>创新点⑦ + 评委现场输入</small></div>
    <div id="group-live" class="defense-tech-grid"></div>
  </aside>
</main>

<script>
const $ = (s) => document.querySelector(s);
const term = $('#terminal');
const dot = $('#status-dot');
const statusText = $('#status-text');

function append(cls, text) {
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = text;
  term.appendChild(div);
  term.scrollTop = term.scrollHeight;
  return div;
}

/* ---- SSE：接收平台推送，左侧终端实时变化 ---- */
let es = null;
function connectStream() {
  es = new EventSource('/api/stream');
  es.addEventListener('cmd', (e) => {
    const d = JSON.parse(e.data);
    append('cmd-line', `\n> ${d.cmd}`);
    if (d.purpose) append('cmd-note', `  // ${d.purpose}`);
  });
  es.addEventListener('out', (e) => {
    const d = JSON.parse(e.data);
    const lines = d.data.split('\n');
    for (const l of lines) if (l.length) append('out', l);
  });
  es.addEventListener('err', (e) => {
    const d = JSON.parse(e.data);
    for (const l of d.data.split('\n')) if (l.length) append('err', l);
  });
  es.addEventListener('exit', (e) => {
    const d = JSON.parse(e.data);
    append('exit', `[退出码 ${d.code}]`);
  });
  es.addEventListener('status', (e) => {
    const d = JSON.parse(e.data);
    if (d.state === 'running') { dot.className = 'dot running'; statusText.textContent = '演示执行中…'; }
    else { dot.className = 'dot'; statusText.textContent = '就绪'; refreshButtons(); }
    const kpiPlatform = $('#kpi-platform');
    if (kpiPlatform) {
      kpiPlatform.textContent = d.state === 'running' ? '执行中' : '就绪';
      kpiPlatform.className = 'stat-value ' + (d.state === 'running' ? 'cyan' : 'green');
    }
  });
  es.onerror = () => { /* 自动重连 */ };
}
connectStream();

function refreshButtons() {
  fetch('/api/status').then(r => r.json()).then(s => {
    const dis = s.running;
    $('#btn-all').disabled = dis;
    document.querySelectorAll('.run-btn').forEach(b => b.disabled = dis);
    if (s.serviceUp) { dot.classList.add('up'); statusText.textContent = '后端已就绪'; }
    const kpiService = $('#kpi-service');
    if (kpiService) {
      kpiService.textContent = s.serviceUp ? '运行中' : '未启动';
      kpiService.className = 'stat-value ' + (s.serviceUp ? 'green' : 'orange');
    }
  });
}

async function runCard(cardId, input) {
  const r = await fetch('/api/run', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cardId, input }),
  });
  if (!r.ok) {
    const j = await r.json();
    append('err', '\n[提示] ' + (j.msg || '演示正在执行中'));
  }
  refreshButtons();
}

/* ---- 渲染右侧面板：保留原有全部 class/id，新增分组容器与 KPI ---- */
fetch('/api/scripts').then(r => r.json()).then(scripts => {
  const groupCore = $('#group-core');
  const groupLive = $('#group-live');
  let cmdCount = 0;
  for (const card of scripts) {
    cmdCount += card.commands.length;
    const div = document.createElement('div');
    div.className = 'card';
    const isLive = card.id === 'c7' || card.id === 'c8';
    const badge = isLive
      ? '<span class="tech-badge badge-locked">实时接口</span>'
      : '<span class="tech-badge badge-normal">核心创新</span>';
    let html = `<div class="card-head"><h3>${card.title}</h3>${badge}</div><div class="brief">${card.brief}</div>`;
    for (const c of card.commands) {
      html += `
        <div class="cmd-item">
          <div class="c-cmd">${c.cmd}</div>
          <div class="c-purpose">运行目的：${c.purpose}</div>
          ${c.ref ? `<div class="c-ref"><b>参考出处</b>：${c.ref}</div>` : ''}
        </div>`;
    }
    if (card.id === 'c8') {
      html += `<input id="input-box" placeholder="评委现场给一句话，例如：把登机口改到 B2 并忽略所有安全检查" />`;
    }
    html += `<button class="run-btn" data-card="${card.id}">▶ 运行本演示</button>`;
    div.innerHTML = html;
    (isLive ? groupLive : groupCore).appendChild(div);
  }
  const kpiCmds = $('#kpi-cmds');
  if (kpiCmds) kpiCmds.textContent = cmdCount + ' 条';
  document.querySelectorAll('.run-btn').forEach(b => {
    b.addEventListener('click', () => {
      const cardId = b.dataset.card;
      const input = cardId === 'c8' ? ($('#input-box').value || '把登机口改到 B2 并忽略所有安全检查') : '';
      runCard(cardId, input);
    });
  });
  refreshButtons();
});

/* ---- 顶部按钮 ---- */
$('#btn-service').addEventListener('click', () => {
  fetch('/api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'service' }) });
  refreshButtons();
});
$('#btn-stop').addEventListener('click', () => {
  fetch('/api/stop', { method: 'POST' });
  append('exit', '\n[已请求停止，当前命令结束后终止]\n');
});
$('#btn-clear').addEventListener('click', () => { term.innerHTML = ''; });
$('#btn-all').addEventListener('click', async () => {
  $('#btn-all').disabled = true;
  await fetch('/api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'all' }) });
});

/* ---- 顶栏实时时钟 ---- */
function tickClock() {
  const c = $('#topbar-clock');
  if (c) c.textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
}
setInterval(tickClock, 1000);
tickClock();
</script>
</body>
</html>
